apiVersion: v1
kind: Service
metadata:
  name: distkv
  labels:
    app.kubernetes.io/name: distkv
    app.kubernetes.io/component: headless
spec:
  # clusterIP: None makes this a headless service — DNS returns individual
  # pod A records (distkv-0.distkv, distkv-1.distkv, distkv-2.distkv) so
  # each node can construct its --peers flag deterministically.
  clusterIP: None
  selector:
    app.kubernetes.io/name: distkv
  ports:
    - name: grpc
      port: 9001
      targetPort: grpc
    - name: metrics
      port: 9101
      targetPort: metrics
