apiVersion: v1
kind: ConfigMap
metadata:
  name: distkv-config
  labels:
    app.kubernetes.io/name: distkv
    app.kubernetes.io/component: config
data:
  # Cluster members expressed as a Raft peer map consumed by distkvd --peers.
  # The headless service "distkv" resolves each pod via DNS:
  #   distkv-0.distkv.<namespace>.svc.cluster.local
  # The StatefulSet passes the full peer string as a flag directly; this
  # ConfigMap is a reference for operators and for future templating.
  cluster-size: "3"
  tick-interval: "50ms"
  election-timeout-min: "10"
  election-timeout-max: "20"
  heartbeat-interval: "3"
