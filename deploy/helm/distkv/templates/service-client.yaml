apiVersion: v1
kind: Service
metadata:
  name: {{ include "distkv.fullname" . }}-client
  labels:
    {{- include "distkv.labels" . | nindent 4 }}
    app.kubernetes.io/component: client
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "distkv.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.service.port }}
      targetPort: grpc
      protocol: TCP
